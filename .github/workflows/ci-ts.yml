name: CI (ts)

# Runs only when the TypeScript workspace (packages/apps) or its shared config
# changes. The TS suites exercise the VENDORED wasm under `apps/*/wasm` and
# `packages/client/wasm` (committed artifacts), so a Rust-source change does not
# trigger this workflow — `wasm-drift.yml` is what guards source↔vendored
# equivalence. The `push` and `pull_request` triggers share one path list via a
# YAML anchor.
on:
  push:
    branches: [main]
    paths: &ts-paths
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths: *ts-paths

jobs:
  web:
    name: web (biome + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  web-app:
    name: "web-app (apps/web: biome + typecheck + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web consumes the built SDK — build it first (dist is gitignored).
      - name: Build SDK (@cdlab/fingerprintd-client)
        run: bun run --filter @cdlab/fingerprintd-client build

      - name: Biome check
        working-directory: apps/web
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Build
        working-directory: apps/web
        run: bun run build

  edge:
    name: "edge (apps/edge: vitest — router + state + parity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Single workspace lockfile lives at the repo root (mirror the web-app job).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/edge
        run: bun run typecheck

      # Runs app.test.ts + state.workers.test.ts + parity.workers.test.ts
      # via @cloudflare/vitest-pool-workers (miniflare); fails on any failure.
      - name: Test (vitest — workers pool)
        working-directory: apps/edge
        run: bun run test

  checkin-risk:
    name: "checkin-risk (apps/checkin-risk: biome + typecheck + test + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Single workspace lockfile lives at the repo root (mirror the edge job).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        working-directory: apps/checkin-risk
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/checkin-risk
        run: bun run typecheck

      # assess + risk-engine + store + velocity-do + integration, node + workers
      # pools via @cloudflare/vitest-pool-workers (miniflare); fails on any failure.
      - name: Test (vitest — node + workers pools)
        working-directory: apps/checkin-risk
        run: bun run test

      - name: Build (wrangler dry-run)
        working-directory: apps/checkin-risk
        run: bun run build

  js-sca:
    name: "js-sca (bun audit — workspace supply-chain)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun audit exits non-zero on advisories >= the given level. Gate at
      # high: fails CI on high/critical vulns while tolerating a transitive
      # dev-only moderate (esbuild dev-server GHSA-67mh-4wv8-2f99) that no
      # workspace dep exposes at runtime.
      - name: Audit dependencies
        run: bun audit --audit-level=high
