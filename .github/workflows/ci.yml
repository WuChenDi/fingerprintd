name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (fmt + clippy + test + build + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (nextest)
        run: cargo nextest run --all-features

      - name: Build
        run: cargo build --all-targets

      - name: Supply-chain (cargo-deny)
        run: cargo deny check

  wasm:
    name: wasm (fp-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Test (fp-wasm)
        run: cargo test -p fp-wasm

  web:
    name: web (biome + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  web-app:
    name: "web-app (apps/web: biome + typecheck + build)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web consumes the built SDK — build it first (dist is gitignored).
      - name: Build SDK (@cdlab/fingerprintd-client)
        run: bun run --filter @cdlab/fingerprintd-client build

      - name: Biome check
        working-directory: apps/web
        run: bunx @biomejs/biome check .

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Build
        working-directory: apps/web
        run: bun run build

  edge:
    name: "edge (apps/edge: vitest — router + state + parity)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Single workspace lockfile lives at the repo root (mirror the web-app job).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/edge
        run: bun run typecheck

      # Runs app.test.ts + state.workers.test.ts + parity.workers.test.ts
      # via @cloudflare/vitest-pool-workers (miniflare); fails on any failure.
      - name: Test (vitest — workers pool)
        working-directory: apps/edge
        run: bun run test

  js-sca:
    name: "js-sca (bun audit — workspace supply-chain)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun audit exits non-zero on advisories >= the given level. Gate at
      # high: fails CI on high/critical vulns while tolerating a transitive
      # dev-only moderate (esbuild dev-server GHSA-67mh-4wv8-2f99) that no
      # workspace dep exposes at runtime.
      - name: Audit dependencies
        run: bun audit --audit-level=high
