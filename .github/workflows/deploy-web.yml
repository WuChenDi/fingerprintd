name: Deploy web (Cloudflare)

# Manual trigger only — deploying is explicit; CI (ci.yml) never auto-deploys.
# Publishes the apps/web SPA as a static-assets Worker to the same Cloudflare
# account as the edge Worker.
#
# Required repository secrets (Settings → Secrets and variables → Actions),
# shared with deploy-edge.yml:
#   CLOUDFLARE_API_TOKEN   deploy auth for wrangler (Workers Scripts:Edit)
#   CLOUDFLARE_ACCOUNT_ID  deploy target account id
# Optional (must equal the edge Worker's runtime key for the browser probe to
# verify against `fingerprintd-edge`, else /identify returns 401 under probe
# enforcement — same secret deploy-edge.yml bakes into the edge WASM):
#   FP_PROBE_KEY           browser nonce-probe key (T8), baked into the SDK WASM

on:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Consumed by wrangler for every remote call.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Kept in sync with ci.yml's Bun setup.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # Bun workspace install from the repo root (one lockfile for all packages).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Rebuild the SDK's vendored WASM from source with the deployment's probe
      # key, so the browser computes the SAME T8 probe the edge Worker verifies.
      # The committed WASM is dev-keyed (test vector); without this the deployed
      # playground would ship it and /identify would 401 under probe enforcement.
      # Mirrors deploy-edge.yml's rebuild. FP_PROBE_KEY unset ⇒ the dev default.
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Rebuild SDK WASM (crates/fp-wasm -> packages/client/wasm)
        env:
          FP_PROBE_KEY: ${{ secrets.FP_PROBE_KEY }}
        run: wasm-pack build --target web --out-dir packages/client/wasm crates/fp-wasm

      # The SPA consumes the built SDK — its dist/ is gitignored, so build it
      # (bundling the freshly-keyed WASM) before the app so `@fingerprintd/client`
      # resolves.
      - name: Build SDK (@fingerprintd/client)
        run: bun run --filter @fingerprintd/client build

      - name: Build web
        working-directory: apps/web
        run: bun run build

      - name: Deploy
        working-directory: apps/web
        run: bun run deploy
