[package]
name    = "fingerprintd"
version = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish                = false

[lints]
workspace = true

[[bin]]
name = "fingerprintd"
path = "src/main.rs"

[lib]
name = "fingerprintd"
path = "src/lib.rs"

[dependencies]
fp-core = { path = "../fp-core" }
# `time` (additive over the workspace features) powers the retention sweep's
# `tokio::time::interval` (finding M6); the rest come from the workspace dep.
tokio = { workspace = true, features = ["time"] }
axum  = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { workspace = true }
figment = { workspace = true, features = ["test"] }
