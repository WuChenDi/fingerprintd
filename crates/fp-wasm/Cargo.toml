[package]
name         = "fp-wasm"
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[lib]
# `cdylib` produces the wasm module for `wasm-pack`; `rlib` keeps the crate
# host-buildable so the native `#[cfg(test)]` parity test runs without a browser.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
hmac = { workspace = true }
sha2 = { workspace = true }
hex  = { workspace = true }

# Inherit the workspace lint policy (deny-warnings, clippy pedantic, Lock 6),
# but relax `unsafe_code` from `forbid` to `deny`: the `#[wasm_bindgen]` export
# glue expands to `unsafe` FFI shims we do not write by hand. `deny` still bans
# unsafe in our own source while permitting the generated boundary code.
[lints.rust]
warnings                      = { level = "deny", priority = -2 }
unsafe_code                   = "deny"
missing_debug_implementations = "warn"
missing_docs                  = "warn"
unreachable_pub               = "warn"
elided_lifetimes_in_paths     = "warn"

[lints.clippy]
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"
dbg_macro   = "deny"
todo        = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
